name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleandesk
          POSTGRES_PASSWORD: cleandesk
          POSTGRES_DB: cleandesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleandesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Build and verify (unit + PostgreSQL integration tests)
        env:
          CLEANDESK_TEST_DB_URL: jdbc:postgresql://localhost:5432/cleandesk_test
          CLEANDESK_TEST_DB_USER: cleandesk
          CLEANDESK_TEST_DB_PASSWORD: cleandesk
        run: mvn -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
          if-no-files-found: ignore
