name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Compile (no tests yet)
        run: mvn -B compile

      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: target/classes
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleandesk
          POSTGRES_PASSWORD: cleandesk
          POSTGRES_DB: cleandesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleandesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Run unit and PostgreSQL integration tests
        env:
          CLEANDESK_TEST_DB_URL: jdbc:postgresql://localhost:5432/cleandesk_test
          CLEANDESK_TEST_DB_USER: cleandesk
          CLEANDESK_TEST_DB_PASSWORD: cleandesk
        run: mvn -B verify

      - name: Publish JUnit test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          require_tests: true
          check_name: Test Results

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
          if-no-files-found: ignore
